{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block body %}
    <div class="auth-card">
        <h1>🦆 Register</h1>

        {% if error %}
            <div class="banner">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" name="first_name" value="{{ first_name }}" maxlength="50" pattern="[^\d\W_]+([ '\-][^\d\W_]+)*" title="Letters, spaces, hyphens, and apostrophes only">

            <label for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" value="{{ last_name }}" maxlength="50" pattern="[^\d\W_]+([ '\-][^\d\W_]+)*" title="Letters, spaces, hyphens, and apostrophes only">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <label for="confirmation">Confirm password</label>
            <input type="password" id="confirmation" name="confirmation">

            <button type="submit">Register</button>
        </form>

        <p class="switch-link">Already have an account? <a href="/login">Log in</a></p>
    </div>
{% endblock %}
